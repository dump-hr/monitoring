name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  ansible_playbook:
    name: Run Ansible playbook
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "./ansible/requirements.txt"

      - name: Install Ansible
        run: |
          pip install -r ./ansible/requirements.txt

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r ./ansible/requirements.yml

      - name: Setup sops
        uses: mdgreenwald/mozilla-sops-action@v1.4.1

      - name: Login to AWS
        id: aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::763640948377:role/dump-monitoring-github-deploy
          aws-region: us-east-1
          output-credentials: true
          output-env-credentials: false

      - name: Configure dump-monitoring AWS profile
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dump-monitoring
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dump-monitoring
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dump-monitoring

      - name: Run Ansible playbook
        run: |
          eval $(ssh-agent)
          ./scripts/ansible-playbook.sh ${{ github.ref_name == 'main' && 'production' || github.ref_name }} monitoring
